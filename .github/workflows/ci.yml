name: CI

# Guards the things that silently killed the data feed before: a lockfile that
# no longer matches package.json (npm ci fails in the scheduled job), syntax
# errors, a broken F&O parser, and a corrupted data archive.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install (fails if package-lock.json is out of sync)
        run: npm ci
      - name: Tests
        run: npm test
